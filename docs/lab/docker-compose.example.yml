# Example: copy to .claude/lab/docker-compose.yml and adjust users/passwords.
# GreenMail user format: localpart:password@domain -> localpart@domain

services:
  greenmail:
    image: greenmail/standalone:2.1.8
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users.login=email
        -Dgreenmail.users=spray:CHANGEME@lab.local,probe:Wrong@lab.local
    ports:
      - "3025:3025"
      - "587:3025"
      - "993:3993"
      - "465:3465"

  roundcube:
    image: roundcube/roundcubemail:latest-apache
    depends_on:
      - greenmail
    ports:
      - "8080:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail
      ROUNDCUBEMAIL_DEFAULT_PORT: "3143"
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: "3025"
